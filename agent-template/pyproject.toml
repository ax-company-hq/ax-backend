[project]
name = "ax-agent-template"
version = "0.1.0"
description = "agent-template — 담당: 준하"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ax-contracts",
    "fastapi>=0.115",
    "httpx>=0.27",
    "redis>=5",
]

[project.scripts]
ax-test-call = "ax_agent_template.testclient:main"

[tool.uv.sources]
ax-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_agent_template"]
