[project]
name = "ax-agent-template"
version = "0.1.0"
description = "agent-template — 담당: 준하"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ax-contracts",
]

[tool.uv.sources]
ax-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_agent_template"]
