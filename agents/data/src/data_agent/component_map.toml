# 코드 경로 → 컴포넌트(지표) 대응표의 원본 (이슈 #206).
# 지표·컴포넌트 이름의 소관은 data. planning은 읽기만 한다.
# metrics 값은 contracts의 BusinessMetric 이름이다 (payment_fail_rate, order_fail_count, order_count).
# 경로가 여러 항목에 맞으면 가장 긴 접두사가 이긴다. 맞는 항목이 없으면 "확인할 수 없음".

[[entry]]
prefixes = ["shop-api/payment/"]
component = "payment"
metrics = ["payment_fail_rate"]

[[entry]]
prefixes = ["shop-api/cart/", "shop-web/cart/"]
component = "cart"
metrics = ["order_fail_count"]

[[entry]]
prefixes = ["shop-web/checkout/"]
component = "checkout"
metrics = ["payment_fail_rate", "order_count"]

[[entry]]
prefixes = ["shop-api/catalog/", "shop-web/catalog/"]
component = "catalog"
metrics = ["order_count"]
