# 재무 AI 1차 판단 기준 (review_hold). 사람만 바꾼다(PR). 모두 제안값이며 테스트하며 조정한다.
#
# 안전 장치 기준(safety thresholds.toml)을 넘어 사람 확인으로 온 건이라도, 아래 "재량 한도" 안이고
# 근거가 맞으면 재무 AI가 승인한다. 한도를 넘는 큰 금액이나 판단 자료가 없는 건은 사람에게 넘긴다.

[coupon]
max_total = 450000                 # 쿠폰 한 번 총액 (기준 30만 원의 1.5배)
max_unit = 30000                   # 쿠폰 한 장 금액 (기준 2만 원의 1.5배)
max_customer_total = 100000        # 한 장애에서 한 고객에게 준 보상 합계 (기준 5만 원의 2배)
max_daily_total = 1500000          # 하루 쿠폰 합계 (기준 100만 원의 1.5배)
max_compensation_to_damage = 1.0   # 한 장애의 보상 합계는 피해 금액을 넘지 않는다

[refund]
max_amount = 300000                # 환불 한 건 (기준 10만 원의 3배). 결제 금액 안이어야 한다

[seller]
reject_risk_at = 90                # 위험 점수가 이 이상이면 재무 AI가 입점을 거절. 70~89는 사람이 확인
