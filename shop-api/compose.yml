services:
  shop-api:
    build:
      context: ..
      dockerfile: shop-api/Dockerfile
    ports:
      - "8010:8010"
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    environment:
      # 컨테이너 안에서 127.0.0.1은 shop-api 자신이라 총괄 서비스 이름으로 가리킨다
      SHOP_ORCHESTRATOR_URL: http://orchestrator:8000
