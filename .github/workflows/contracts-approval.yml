name: contracts-approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: contracts-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts-approval:
    # 브랜치 보호의 필수 체크 이름. 바꾸지 않는다.
    name: contracts-approval
    runs-on: ubuntu-latest
    steps:
      - name: Require 2 approvals when contracts/ changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUIRED: "2"
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if ! grep -q '^contracts/' <<<"$files"; then
            echo "contracts/ 변경 없음 → 통과"
            exit 0
          fi

          # 레포 권한이 있는 사람(OWNER·MEMBER·COLLABORATOR)만, 사람마다 마지막 리뷰 상태(COMMENTED 제외)를 센다
          approvals=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq '.[] | select(.state != "COMMENTED")
              | select(.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))
              | "\(.user.login) \(.state)"' \
            | awk '{ last[$1] = $2 } END { n = 0; for (u in last) if (last[u] == "APPROVED") n++; print n }')

          echo "contracts/ 변경 있음 → 승인 ${approvals}개 / 필요 ${REQUIRED}개"
          if [ "$approvals" -lt "$REQUIRED" ]; then
            echo "::error::contracts/를 바꾸는 PR은 승인(APPROVED) 리뷰가 ${REQUIRED}개 이상 필요하다."
            exit 1
          fi
