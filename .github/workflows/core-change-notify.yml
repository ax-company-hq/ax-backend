name: core-change-notify

# 핵심 파일(.github/·.claude/·CODEOWNERS·기준표 toml)을 바꾼 PR이 dev에 머지되면
# core-change 라벨 + report 이슈에 @재현 멘션 한 줄 (docs/automation-spec.md 12장). 스위치 무관.
# code owner 리뷰 필수가 꺼져 있어 사후 확인용. PR 코드는 checkout하지 않는다.
on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev, persist-credentials: false, sparse-checkout: .github }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: team.py 의존성
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r .github/scripts/requirements.txt
      - name: ax-bot token
        id: bot
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.AX_BOT_APP_ID }}
          private-key: ${{ secrets.AX_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: report 기록
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I .github/scripts/claude_jobs.py core-merged --pr "$PR"
