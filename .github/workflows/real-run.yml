name: real-run

# 실서버 실행: 서버 PC(self-hosted runner)에서 compose를 올리고 시나리오 A를 AX_E2E_MODE=real로 돈다.
# 매일 02:00 KST(평일, 금요일은 3회 연속) + 수동. repo 변수 AX_REAL_RUN이 on이 아니면 모든 job이 건너뛰어진다 (아무 동작 없음).
#
# 보안 (public 레포): 서버 PC에서 도는 워크플로이므로
#  - 트리거는 schedule, workflow_dispatch뿐이다. pull_request 계열·issue 계열 트리거를 쓰지 않는다
#  - 수동 실행은 code owner만 (guard job이 CODEOWNERS로 확인, 실패하면 서버 PC job이 시작되지 않는다)
#  - checkout은 항상 dev 하나. 외부 코드는 서버 PC에 닿지 않는다
#  - 키는 서버 PC의 .env에만 있다 (위치는 runner 환경변수 AX_REAL_ENV_FILE, 작업 폴더 밖만 허용; 실행 중에만 작업 폴더로 복사하고 항상 지운다). 워크플로에 secrets를 넣지 않고 환경변수를 출력하지 않는다
#  - 이 라벨을 다른 워크플로가 쓰면 automation-tests가 실패한다 (real_guard.py check-runner-label)
# 설치·끄는 법: docs/automation/self-hosted-runner.md
on:
  schedule:
    - cron: "0 17 * * 0-4" # 02:00 KST 월~금 (UTC 일~목). 금요일(KST)은 3회 연속
  workflow_dispatch:
    inputs:
      runs:
        description: "연속 실행 횟수 (auto: 금요일 3회, 그 밖 1회)"
        required: false
        default: auto
        type: choice
        options: [auto, "1", "2", "3"]

permissions: {}

concurrency:
  # 서버 PC 하나를 쓰므로 직렬화한다. 진행 중 실행은 취소하지 않는다
  group: real-run
  cancel-in-progress: false

jobs:
  guard:
    # 서버 PC job 전에 ubuntu에서 실행자를 확인한다. dev가 아닌 ref로 수동 실행하면 건너뛴다
    if: vars.AX_REAL_RUN == 'on' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          persist-credentials: false
      - name: 실행자 확인 (수동 실행은 code owner만)
        env:
          ACTOR: ${{ github.triggering_actor }} # 재실행(re-run)한 사람
          EVENT: ${{ github.event_name }}
        run: python3 -I .github/scripts/real_guard.py check-actor --actor "$ACTOR" --event "$EVENT"
      - name: 서버 PC 라벨 사용처 확인
        run: python3 -I .github/scripts/real_guard.py check-runner-label

  run:
    needs: guard
    if: vars.AX_REAL_RUN == 'on' && github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, ax-server]
    defaults:
      run:
        shell: bash # Windows 기본은 pwsh라 "$VAR" 같은 bash 문법이 깨진다 (Git for Windows bash 필요)
    # 금요일 3회 연속이 들어가는 전체 예산 (real_run.py의 TOTAL_BUDGET 220분 + 정리)
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          persist-credentials: false
          clean: true
      - name: 실행자 재확인 (서버 PC에서 한 번 더, 재실행 우회 방지)
        env:
          ACTOR: ${{ github.triggering_actor }}
          EVENT: ${{ github.event_name }}
        run: python .github/scripts/real_guard.py check-actor --actor "$ACTOR" --event "$EVENT"
      - name: 의존성
        run: uv sync --all-packages --locked
      - name: 실서버 실행 (up -> 헬스 -> 결제 장애 -> e2e real -> down -v)
        id: real
        env:
          RUNS: ${{ inputs.runs || 'auto' }}
        run: python .github/scripts/real_run.py run --runs "$RUNS" --out real-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: real-result
          path: |
            real-out/real-result.json
            real-out/real-detail.json
          if-no-files-found: ignore
          retention-days: 30
      - name: 녹화 도구 (게이트웨이가 있을 때만 의미 있음)
        if: ${{ steps.real.outputs.pass_day == 'true' }}
        continue-on-error: true
        run: uv run --with playwright==1.49.1 python -m playwright install chromium
      - name: 화면 녹화 (/ 와 /admin/, 게이트웨이 없으면 건너뜀)
        id: rec
        if: ${{ steps.real.outputs.pass_day == 'true' }}
        continue-on-error: true
        run: uv run --with playwright==1.49.1 python .github/scripts/real_run.py record --out recording
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.rec.outputs.recorded == 'true' }}
        with:
          name: ${{ steps.real.outputs.rec_name }}
          path: recording/
          retention-days: 90
      - name: 정리 (항상 ax-real 프로젝트만 down -v, 상시 스택은 건드리지 않음)
        if: always()
        continue-on-error: true
        run: python .github/scripts/real_run.py cleanup
      - name: 작업 폴더 .env 삭제 (항상)
        if: always()
        run: python -c "import pathlib; pathlib.Path('.env').unlink(missing_ok=True)"

  follow:
    # mock pass / real fail 단계 -> 담당 부서 이슈 (real_follow.py, AX_REAL_RUN=on일 때만)
    needs: run
    if: ${{ vars.AX_REAL_RUN == 'on' && needs.run.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: team.py 의존성
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r .github/scripts/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: real-result
          path: real
      - name: ax-bot token
        id: bot
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.AX_BOT_APP_ID }}
          private-key: ${{ secrets.AX_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-actions: read
          permission-contents: read
      - name: mock 결과와 비교해 이슈
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          AX_REAL_RUN: ${{ vars.AX_REAL_RUN }}
          SHA: ${{ github.sha }}
        run: |
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -I .github/scripts/real_follow.py prev-mock --out mock >/dev/null
          "$py" -I .github/scripts/real_follow.py act --real real/real-result.json \
            --detail real/real-detail.json --mock mock/e2e-result.json --sha "$SHA"
