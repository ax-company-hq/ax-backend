name: wip-resume

# 봇 부서 PR이 머지·닫히면 그 부서의 wip-wait 이슈 1개를 다시 작성하게 한다 (docs/automation-spec.md 11장).
# PR 코드는 checkout하지 않는다.
on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions: {}

# concurrency 그룹을 두지 않는다: 하나로 묶으면 대기 중인 재개가 다음 실행에 밀려 취소된다.
# 같은 이슈를 두 번 실행해도 두 번째 prep이 in-progress·wip로 막는다

jobs:
  resume:
    if: >-
      vars.AX_AUTOMATION == 'on' &&
      github.event.pull_request.user.login == 'ax-company-hq-bot[bot]'
    runs-on: ubuntu-latest
    environment: bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev, persist-credentials: false, sparse-checkout: .github }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: team.py 의존성
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r .github/scripts/requirements.txt
      - name: ax-bot token
        id: bot
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.AX_BOT_APP_ID }}
          private-key: ${{ secrets.AX_BOT_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: read
          permission-actions: write
      - name: 재개
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 사람이 닫은 봇 PR이면 연결 이슈의 in-progress를 떼고, 자리가 난 부서의 대기 이슈를 재개
          "$RUNNER_TEMP/venv/bin/python" -I .github/scripts/claude_jobs.py wip-resume \
            --branch "$BRANCH" --pr "$PR"
