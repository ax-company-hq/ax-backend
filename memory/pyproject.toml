[project]
name = "ax-memory"
version = "0.1.0"
description = "memory — 담당: 재현"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ax-contracts",
    "ax-agent-template",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
ax-agent-template = { workspace = true }
ax-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_memory"]
