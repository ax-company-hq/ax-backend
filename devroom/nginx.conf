# AX 개발실 nginx: 정적 화면 + AX_DEVROOM_DIR의 status.json (읽기 전용 마운트)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /status.json {
        # 갱신 작업이 임시 파일에 쓴 뒤 rename하므로 반쯤 쓴 파일이 보이지 않는다
        alias /data/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /status.example.json {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
