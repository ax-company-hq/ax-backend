# 액션 등급 레지스트리 (SAF-02, 공통 구성안 7장 "액션 등급 신고").
#
# 각 부서가 신고한 상태 변경 액션의 기본 등급·검증자·금액 필드다. 사람만 바꾼다(PR).
# Agent Card의 grade·verifier와 다르면 이 파일이 우선한다.
#
# - owner: 이 액션을 execute()로 요청할 수 있는 유일한 에이전트 (토큰의 requester와 같아야 한다)
# - base_grade: A | B | C. 금액 기준(thresholds.toml)이 더 높으면 그쪽을 쓴다
# - verifier, verify_skill: B 교차검증 주체와 그 skill. owner와 같으면 등록을 거부한다
# - amount: 금액 계산 방법. count_field × unit_field 또는 amount_field 하나
#   claimed_fields는 요청 쪽이 적어 보낸 총액 필드다. 코드 계산값과 다르면 C(amount_mismatch)
# - on_verify_reject: 에이전트 검증자가 거절했을 때 "reject"(기본, 바로 rejected) | "hold"(사람 보류 큐 C)
# - customer_field, purpose_field: 누적 기준(고객당·사건당 보상)에 쓰는 필드

# ---- 마케팅 (재헌)
[[actions]]
action = "publish_notice"
owner = "marketing"
base_grade = "A"

# 쿠폰·환불은 A (재무 재설계 2026-10-23, docs/notes/finance/2026-10-23-finance-redesign.md 4장).
# 건별 검사는 이 관문의 코드 규칙이 한다: 금액 계산, claimed_fields 불일치(C), 기준표 한도(C).
# 재무 교차검증(verify_amount)은 없앴다. 재무는 한도를 정하고 사후 감사를 한다.
[[actions]]
action = "issue_coupon"
owner = "marketing"
base_grade = "A"
customer_field = "buyer_id"
purpose_field = "purpose_code"
amount = { count_field = "count", unit_field = "unit_value", claimed_fields = ["total_value", "claimed_total"] }

# ---- 고객지원 (병환)
[[actions]]
action = "refund_request"
owner = "support"
base_grade = "A"
amount = { amount_field = "refund_amount" }

[[actions]]
action = "create_inquiry"
owner = "support"
base_grade = "A"

[[actions]]
action = "add_customer_message"
owner = "support"
base_grade = "A"

[[actions]]
action = "send_reply"
owner = "support"
base_grade = "A"

[[actions]]
action = "reject_draft"
owner = "support"
base_grade = "A"

[[actions]]
action = "set_inquiry_status"
owner = "support"
base_grade = "A"

# 클레임 처리 기록 (#105). 돈이 나가지 않는 기록만. 환불 지급은 refund_request(A, 한도 넘으면 C)
[[actions]]
action = "create_claim"
owner = "support"
base_grade = "A"

[[actions]]
action = "decide_claim"
owner = "support"
base_grade = "A"

[[actions]]
action = "receive_return"
owner = "support"
base_grade = "A"

[[actions]]
action = "inspect_return"
owner = "support"
base_grade = "A"

# ---- 인사 (준하)
[[actions]]
action = "record_case"
owner = "hr"
base_grade = "A"

# 인수인계·담당 변경 (#180). 기록·진행은 A, 확정은 B. 온보딩·발령 요청·퇴직 확정은 hr에서 빠져서
# (#374, #375) 등록하지 않는다. 미등록은 항상 C(사람 승인)라 다시 쓰려면 그때 새로 등록한다
[[actions]]
action = "start_handover"
owner = "hr"
base_grade = "A"

[[actions]]
action = "answer_handover_question"
owner = "hr"
base_grade = "A"

# 확신 낮은 후보 카드 승인·폐기 (#177). 사람이 대시보드에서 고르고 hr skill이 execute()를 부른다
[[actions]]
action = "decide_candidate_card"
owner = "hr"
base_grade = "A"

# 인수인계 확정: planning이 verify_handover로 검증. 완성도가 기준 미만이면 C (thresholds.toml)
[[actions]]
action = "confirm_handover"
owner = "hr"
base_grade = "B"
verifier = "planning"
verify_skill = "verify_handover"

# 완성도 미달 상태로 확정하려면 항상 사람 승인
[[actions]]
action = "confirm_handover_incomplete"
owner = "hr"
base_grade = "C"

# ---- 인프라 DejaFix (예진). 서버 재부팅·파일 삭제는 등록하지 않는다(미등록 = C)
[[actions]]
action = "rollback_deployment"
owner = "infra"
base_grade = "B"
verifier = "planning"
verify_skill = "verify_rollback_target"
# 검증자가 롤백 대상을 거절해도 장애는 계속되므로 끝내지 않고 사람이 본다 (SCN-A, 인프라 합의)
on_verify_reject = "hold"

[[actions]]
action = "restart_service"
owner = "infra"
base_grade = "B"
verifier = "data"
verify_skill = "anomaly_detection"

# ---- 재무 (태윤). 재무가 재무를 검증하지 않도록 정산 확정은 항상 C
[[actions]]
action = "confirm_settlement"
owner = "finance"
base_grade = "C"

# ---- 재무 마켓운영 (태윤). 마켓운영은 재무 도메인 skill로 흡수(구성안 수정 요청). 판매자 위험은 data가 다시 본다
[[actions]]
action = "seller_review"
owner = "finance"
base_grade = "B"
verifier = "data"
verify_skill = "fraud_score"

[[actions]]
action = "settlement_hold"
owner = "finance"
base_grade = "B"
verifier = "data"
verify_skill = "fraud_score"

# ---- 회사 기억 (재현, #41). 카드 쓰기는 여러 부서가, 대체·폐기 연결은 hr만 요청한다
[[actions]]
action = "memory.card_write"
owner = "memory"
requesters = ["hr", "support", "marketing", "planning", "finance", "orchestrator", "data"]
base_grade = "A"

[[actions]]
action = "memory.card_link"
owner = "memory"
requesters = ["hr"]
base_grade = "A"

# ---- 변경 요청 결과 받기 (#280·#292). planning이 요청을 닫을 때 보낸 결과를 요청 부서가 자기 기록에 반영한다
# 상태 변경은 요청 부서 쪽 기록뿐이고 돈·외부 시스템을 건드리지 않아 A. 멱등성 키 ctx_req_…:change_result:REQ-n
[[actions]]
action = "receive_change_result"
owner = "support"
requesters = ["support", "hr", "data"]
base_grade = "A"

# ---- 기획개발 (예진). 검증자 = 안전 레이어 코드 규칙(변경 크기·허용 경로, thresholds.toml)
[[actions]]
action = "generate_pr"
owner = "planning"
base_grade = "B"
verifier = "safety"

# 변경 요청 접수는 A (#173). 요청 부서는 A2A로 부르고, execute()는 planning이 부른다
[[actions]]
action = "create_ticket"
owner = "planning"
base_grade = "A"

# 기록·회신·초안은 A (#166). 돈·배포에 닿지 않는다
[[actions]]
action = "write_spec"
owner = "planning"
base_grade = "A"

[[actions]]
action = "split_tasks"
owner = "planning"
base_grade = "A"

[[actions]]
action = "review_pr"
owner = "planning"
base_grade = "A"

[[actions]]
action = "send_message"
owner = "planning"
base_grade = "A"

# 기획서 확정은 A. 열린 질문·기각 경고·근거 없음·되돌릴 수 없는 영역이면 C (thresholds.toml)
[[actions]]
action = "confirm_spec"
owner = "planning"
base_grade = "A"

# PR 머지는 B, 검증자 = 코드 규칙(generate_pr와 같은 크기·경로 기준 + 검수 불일치·장애 연결·되돌릴 수 없는 영역)
[[actions]]
action = "merge_pr"
owner = "planning"
base_grade = "B"
verifier = "safety"
