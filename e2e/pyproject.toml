[project]
name = "ax-e2e"
version = "0.1.0"
description = "e2e — 시나리오 A 단계별 점수 (사람 경로: 재현·준하·태윤)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ax-contracts",
    "ax-agent-template",
    "ax-orchestrator",
    "ax-agent-data",
    "ax-agent-finance",
    "ax-agent-hr",
    "ax-agent-infra",
    "ax-agent-marketing",
    "ax-agent-planning",
    "ax-agent-support",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.scripts]
ax-e2e = "ax_e2e.scenario_a.cli:main"

[tool.uv.sources]
ax-contracts = { workspace = true }
ax-agent-template = { workspace = true }
ax-orchestrator = { workspace = true }
ax-agent-data = { workspace = true }
ax-agent-finance = { workspace = true }
ax-agent-hr = { workspace = true }
ax-agent-infra = { workspace = true }
ax-agent-marketing = { workspace = true }
ax-agent-planning = { workspace = true }
ax-agent-support = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_e2e"]
